name: FTP Deployment

# Der Workflow startet bei jedem Push in den 'main' Branch
on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Deploy Website
    runs-on: ubuntu-latest
    
    steps:
      # 1. Schritt: Aktuellen Code aus dem Repository laden
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      # 2. Schritt: Dateien per FTP übertragen
      - name: 📂 Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          # Diese Namen müssen EXAKT so in den GitHub Secrets stehen:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          
          # Optionale Einstellungen:
          # local-dir: ./        # Falls alles im Hauptordner liegt
          # server-dir: /www/     # Zielordner auf deinem Webserver (anpassen falls nötig!)
          # dry-run: false        # Wenn true, wird nur simuliert (Testmodus)
