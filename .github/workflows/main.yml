name: FTP Deployment

on:
  push:
    branches:
      - main  # Workflow startet, sobald du in den Main-Branch pushst

jobs:
  web-deploy:
    name: Deploy Website
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

       - name: 📂 Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}    # Muss eingerückt unter 'with' stehen
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # local-dir: ./     # (Optional) Falls nur ein Unterordner hochgeladen werden soll
          # server-dir: /www/  # (Optional) Zielordner auf deinem Server
